<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" viewBox="0 0 320 80" fill="none">
  <defs>
    <style>
      .bs-fill{fill:#6D8196}
      .word{fill:#4A4A4A;font-family:Inter, sans-serif;font-weight:700;font-size:36px}
    </style>
  </defs>
  <!-- Icon: rounded square with bars and checkmark -->
  <rect x="0.5" y="0.5" width="64" height="64" rx="8" class="bs-fill" opacity="0.1" stroke="#6D8196"/>
  <!-- Bars -->
  <rect x="10" y="34" width="10" height="18" rx="2" fill="#6D8196"/>
  <rect x="24" y="26" width="10" height="26" rx="2" fill="#6D8196"/>
  <rect x="38" y="18" width="10" height="34" rx="2" fill="#6D8196"/>
  <!-- Check mark -->
  <path d="M16 40 L24 48 L48 20" stroke="#4A4A4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Wordmark -->
  <text x="86" y="50" class="word">BidSense</text>
</svg>